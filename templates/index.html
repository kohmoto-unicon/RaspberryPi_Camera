<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raspberry Pi Camera Streaming</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .video-container {
            position: relative;
            width: 95%;
            max-width: 1400px;
            margin: 0 auto 30px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            aspect-ratio: 16 / 9;
            background: #000;
        }

        .video-stream {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: #000;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #56ab2f 0%, #a8e6cf 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(86, 171, 47, 0.4);
        }

        .btn-warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-warning:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(240, 147, 251, 0.4);
        }

        .status {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #4facfe;
        }

        .status h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-online {
            background: #28a745;
        }

        .status-offline {
            background: #dc3545;
        }

        .snapshot-container {
            text-align: center;
            margin-top: 30px;
        }

        .snapshot-image {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            margin-top: 15px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4facfe;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            border: 1px solid #f5c6cb;
        }

        .nav-links {
            text-align: center;
            margin-bottom: 20px;
        }

        .nav-links a {
            display: inline-block;
            padding: 10px 20px;
            margin: 0 10px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }
            
            .video-container {
                width: 100%;
                border-radius: 10px;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 300px;
                justify-content: center;
            }
            
            .content {
                padding: 15px;
            }
        }

        @media (min-width: 769px) and (max-width: 1200px) {
            .video-container {
                width: 90%;
            }
        }

        @media (min-width: 1201px) {
            .video-container {
                width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ラズパイカメラストリーミング</h1>
            <p>リアルタイムカメラフィードとコントロール</p>
        </div>

        <div class="content">
            <div class="nav-links">
                <a href="/">カメラストリーミング</a>
                <a href="/pump_control">ハイセラポンプ</a>
                <a href="/syringe_pump">シリンジポンプ</a>
            </div>

            <div class="status">
                <h3>システム状態</h3>
                <p>
                    <span class="status-indicator" id="cameraStatus"></span>
                    <span id="statusText">カメラ状態を確認中...</span>
                </p>
                <p id="timestamp"></p>
            </div>

            <div class="video-container">
                <!-- MJPEGストリーミング（デフォルト） -->
                <img src="{{ url_for('video_feed') }}" alt="カメラストリーム" class="video-stream" id="videoStreamMjpeg" style="display: block;">
                
                <!-- HLSストリーミング（FFmpeg） -->
                <video id="videoStreamHls" class="video-stream" controls style="display: none;" autoplay muted>
                    <source src="" type="application/vnd.apple.mpegurl">
                    お使いのブラウザはHLSストリーミングをサポートしていません。
                </video>
            </div>

            <div class="controls">
{#
                <button class="btn btn-primary" onclick="checkStatus()">
                    🔄 状態確認
                </button>
#}
                <button class="btn btn-success" onclick="takeSnapshot()">
                    スナップショット
                </button>
                <button class="btn btn-warning" onclick="restartCamera()">
                    カメラ再起動
                </button>

{#
                <button class="btn btn-primary" onclick="startFFmpegStreaming()">
                    🎬 FFmpeg開始
                </button>
                <button class="btn btn-warning" onclick="stopFFmpegStreaming()">
                    ⏹️ FFmpeg停止
                </button>
                <button class="btn btn-success" onclick="switchToHLS()">
                    📺 HLS表示
                </button>
                <button class="btn btn-success" onclick="switchToMJPEG()">
                    🖼️ MJPEG表示
                </button>
                <!-- 追加: カメラ解像度/FPS 設定 -->
                <div style="display:flex; gap:8px; align-items:center;">
                    <input id="camWidth" type="number" min="1" placeholder="幅" style="width:90px; padding:8px; border-radius:8px; border:1px solid #ccc;">
                    <input id="camHeight" type="number" min="1" placeholder="高さ" style="width:90px; padding:8px; border-radius:8px; border:1px solid #ccc;">
                    <input id="camFps" type="number" min="1" placeholder="FPS" style="width:80px; padding:8px; border-radius:8px; border:1px solid #ccc;">
                    <button class="btn btn-primary" onclick="applyCameraSettings()">適用</button>
                </div>
#}
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>処理中...</p>
            </div>

            <div class="snapshot-container" id="snapshotContainer" style="display: none;">
                <h3>📸 スナップショット</h3>
                <img id="snapshotImage" class="snapshot-image" alt="スナップショット">
                <br>
                <a id="downloadLink" class="btn btn-primary" download="snapshot.jpg">
                    ダウンロード
                </a>
            </div>
        </div>
    </div>

    <script>
        // 状態確認
        async function checkStatus() {
            showLoading(true);
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                const statusIndicator = document.getElementById('cameraStatus');
                const statusText = document.getElementById('statusText');
                const timestamp = document.getElementById('timestamp');

                // API が返す構造に合わせて判定（data.camera.initialized を使用）
                const camInfo = data.camera || {};
                const camInit = !!camInfo.initialized;

                if (camInit) {
                    statusIndicator.className = 'status-indicator status-online';
                    // 解像度やFPSがあれば表示
                    const res = camInfo.resolution ? ` ${camInfo.resolution}` : '';
                    const fps = camInfo.fps ? ` @${camInfo.fps}fps` : '';
                    statusText.textContent = `カメラ: オンライン${res}${fps}`;
                } else {
                    statusIndicator.className = 'status-indicator status-offline';
                    statusText.textContent = 'カメラ: オフライン';
                }
                
                // シリアル通信状態（API のフィールドに合わせて判定）
                const serialOnline = !!(data.serial_initialized_1 || data.serial_initialized_2 || data.syringe_serial_initialized);
                console.log('シリアル通信:', serialOnline ? 'オンライン' : 'オフライン');
                
                if (data.timestamp) {
                    const date = new Date(data.timestamp * 1000);
                    timestamp.textContent = `最終更新: ${date.toLocaleString('ja-JP')}`;
                } else {
                    timestamp.textContent = '';
                }
                
            } catch (error) {
                showError('状態確認に失敗しました: ' + (error.message || error));
            } finally {
                showLoading(false);
            }
        }

        // スナップショット取得
        async function takeSnapshot() {
            showLoading(true);
            try {
                const response = await fetch('/api/snapshot');
                
                if (response.ok) {
                    const blob = await response.blob();
                    const imageUrl = URL.createObjectURL(blob);
                    
                    const snapshotImage = document.getElementById('snapshotImage');
                    const downloadLink = document.getElementById('downloadLink');
                    const snapshotContainer = document.getElementById('snapshotContainer');
                    
                    snapshotImage.src = imageUrl;
                    downloadLink.href = imageUrl;
                    snapshotContainer.style.display = 'block';
                    
                    // ページの最下部にスクロール
                    snapshotContainer.scrollIntoView({ behavior: 'smooth' });
                    
                } else {
                    const errorData = await response.json();
                    showError('スナップショット取得に失敗しました: ' + errorData.error);
                }
                
            } catch (error) {
                showError('スナップショット取得に失敗しました: ' + error.message);
            } finally {
                showLoading(false);
            }
        }

        // カメラ再起動
        async function restartCamera() {
            if (!confirm('カメラを再起動しますか？')) {
                return;
            }
            
            showLoading(true);
            try {
                const response = await fetch('/api/restart_camera');
                const data = await response.json();
                
                if (data.success) {
                    alert('カメラを再起動しました。ページを再読み込みしてください。');
                    location.reload();
                } else {
                    showError('カメラ再起動に失敗しました: ' + data.message);
                }
                
            } catch (error) {
                showError('カメラ再起動に失敗しました: ' + error.message);
            } finally {
                showLoading(false);
            }
        }

        // カメラ設定取得
        async function getCameraSettings() {
            try {
                const res = await fetch('/api/get_camera_settings');
                const data = await res.json();
                document.getElementById('camWidth').value = data.width || 640;
                document.getElementById('camHeight').value = data.height || 480;
                document.getElementById('camFps').value = data.fps || 30;
            } catch (e) {
                console.warn('カメラ設定取得失敗', e);
            }
        }

        // カメラ設定適用
        async function applyCameraSettings() {
            const w = parseInt(document.getElementById('camWidth').value) || 640;
            const h = parseInt(document.getElementById('camHeight').value) || 480;
            const f = parseInt(document.getElementById('camFps').value) || 30;

            if (f < 1 || w < 1 || h < 1) {
                showError('無効な設定値です');
                return;
            }

            showLoading(true);
            try {
                const res = await fetch(`/api/set_camera_settings`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({width: w, height: h, fps: f})
                });
                const data = await res.json();
                if (data.success) {
                    alert(`設定を適用しました: ${data.width}x${data.height}@${data.fps}fps`);
                    // ストリームをリロードしてサイズ反映を試みる
                    const img = document.getElementById('videoStream');
                    img.src = img.src.split('?')[0] + '?t=' + Date.now();
                } else {
                    showError('設定適用に失敗しました: ' + (data.message || '不明なエラー'));
                }
            } catch (e) {
                showError('設定適用に失敗しました: ' + e.message);
            } finally {
                showLoading(false);
            }
        }

        // ローディング表示
        function showLoading(show) {
            const loading = document.getElementById('loading');
            loading.style.display = show ? 'block' : 'none';
        }

        // エラー表示
        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.textContent = message;
            
            const content = document.querySelector('.content');
            content.insertBefore(errorDiv, content.firstChild);
            
            // 3秒後にエラーメッセージを削除
            setTimeout(() => {
                errorDiv.remove();
            }, 3000);
        }

        // FFmpegストリーミング開始
        async function startFFmpegStreaming() {
            showLoading(true);
            try {
                const response = await fetch('/api/start_ffmpeg_streaming');
                const data = await response.json();
                
                if (data.success) {
                    alert('FFmpegストリーミングを開始しました');
                    checkFFmpegStatus();
                } else {
                    showError('FFmpegストリーミング開始に失敗しました: ' + data.message);
                }
                
            } catch (error) {
                showError('FFmpegストリーミング開始に失敗しました: ' + error.message);
            } finally {
                showLoading(false);
            }
        }

        // FFmpegストリーミング停止
        async function stopFFmpegStreaming() {
            if (!confirm('FFmpegストリーミングを停止しますか？')) {
                return;
            }
            
            showLoading(true);
            try {
                const response = await fetch('/api/stop_ffmpeg_streaming');
                const data = await response.json();
                
                if (data.success) {
                    alert('FFmpegストリーミングを停止しました');
                    switchToMJPEG(); // MJPEGに切り替え
                    checkFFmpegStatus();
                } else {
                    showError('FFmpegストリーミング停止に失敗しました: ' + data.message);
                }
                
            } catch (error) {
                showError('FFmpegストリーミング停止に失敗しました: ' + error.message);
            } finally {
                showLoading(false);
            }
        }

        // FFmpeg状態確認
        async function checkFFmpegStatus() {
            try {
                const response = await fetch('/api/ffmpeg_status');
                const data = await response.json();
                
                console.log('FFmpeg状態:', data);
                return data;
                
            } catch (error) {
                console.error('FFmpeg状態確認エラー:', error);
                return null;
            }
        }

        // デバイス検出
        function isSafari() {
            const ua = navigator.userAgent;
            return /Safari/.test(ua) && !/Chrome/.test(ua);
        }
        
        function isMobile() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }
        
        function isIOS() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent);
        }

        // HLSストリーミングに切り替え
        async function switchToHLS() {
            const ffmpegStatus = await checkFFmpegStatus();
            
            if (!ffmpegStatus || !ffmpegStatus.ffmpeg_running) {
                showError('FFmpegストリーミングが実行されていません。まずFFmpegを開始してください。');
                return;
            }
            
            // Safari/iOSの場合は特別な処理
            if (isSafari() || isIOS()) {
                if (confirm('Safari/iOSではHLSストリーミングが制限される場合があります。\nMJPEGストリーミングを使用しますか？')) {
                    switchToMJPEG();
                    return;
                }
            }
            
            const mjpegElement = document.getElementById('videoStreamMjpeg');
            const hlsElement = document.getElementById('videoStreamHls');
            
            // MJPEGを非表示
            mjpegElement.style.display = 'none';
            
            // HLSを表示
            hlsElement.style.display = 'block';
            
            // HLSソースを設定
            const source = hlsElement.querySelector('source');
            source.src = '/video_feed_hls';
            hlsElement.load();
            
            // Safari/iOSの場合は自動再生を試行
            if (isSafari() || isIOS()) {
                try {
                    await hlsElement.play();
                } catch (error) {
                    console.warn('Safari/iOSでの自動再生に失敗:', error);
                    showError('Safari/iOSでは手動で再生ボタンを押してください。');
                }
            }
            
            alert('HLSストリーミングに切り替えました');
        }

        // MJPEGストリーミングに切り替え
        function switchToMJPEG() {
            const mjpegElement = document.getElementById('videoStreamMjpeg');
            const hlsElement = document.getElementById('videoStreamHls');
            
            // HLSを非表示
            hlsElement.style.display = 'none';
            
            // MJPEGを表示
            mjpegElement.style.display = 'block';
            
            alert('MJPEGストリーミングに切り替えました');
        }

        // ページ読み込み時に状態確認・設定取得
        document.addEventListener('DOMContentLoaded', function() {
            checkStatus();
            getCameraSettings();
            checkFFmpegStatus();
            
            // デバイス検出とメッセージ表示
            if (isSafari() || isIOS()) {
                console.log('Safari/iOSデバイスを検出しました');
                showError('Safari/iOSではMJPEGストリーミングを推奨します。HLSストリーミングは制限される場合があります。');
            }
            
            // 30秒ごとに状態確認
            setInterval(checkStatus, 30000);
            
            // 10秒ごとにFFmpeg状態確認
            setInterval(checkFFmpegStatus, 10000);
        });
    </script>
</body>
</html>
