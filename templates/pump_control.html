<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハイセラポンプ制御</title>
    <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .header p {
      font-size: 1.1em;
      opacity: 0.9;
    }

    .content {
      padding: 30px;
    }

    .pump-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .pump-box { 
      border: 2px solid #e0e0e0; 
      padding: 20px; 
      margin: 10px; 
      border-radius: 15px; 
      background: white;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }

    .pump-box:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    .pump-box h2 { 
      margin: 0 0 15px; 
      color: #333;
      font-size: 1.5em;
      text-align: center;
    }

    .control-group {
      margin-bottom: 15px;
    }

    .control-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #555;
    }

    .switch { 
      position: relative; 
      display: inline-block; 
      width: 60px; 
      height: 34px; 
    }

    .switch input { 
      display: none; 
    }

    .slider {
      position: absolute; 
      cursor: pointer; 
      top: 0; 
      left: 0; 
      right: 0; 
      bottom: 0;
      background-color: #ccc; 
      transition: .4s; 
      border-radius: 34px;
    }

    .slider:before {
      position: absolute; 
      content: ""; 
      height: 26px; 
      width: 26px;
      left: 4px; 
      bottom: 4px; 
      background-color: white; 
      transition: .4s; 
      border-radius: 50%;
    }

    input:checked + .slider { 
      background-color: #2196F3; 
    }

    input:checked + .slider:before { 
      transform: translateX(26px); 
    }

    .direction-label {
      display: inline-block;
      margin-left: 10px;
      font-weight: 600;
      color: #333;
    }

    .input-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .input-group input[type="number"] {
      flex: 1;
      padding: 8px 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }

    .input-group input[type="number"]:focus {
      outline: none;
      border-color: #4facfe;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn { 
      padding: 10px 20px; 
      margin: 5px; 
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      flex: 1;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-danger {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
    }

    .btn-danger:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(240, 147, 251, 0.4);
    }

    .btn-info {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 5px 10px;
      font-size: 12px;
    }

    .btn-info:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .current-display {
      display: inline-block;
      padding: 8px 12px;
      background: #f8f9fa;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-weight: 600;
      color: #333;
      min-width: 80px;
      text-align: center;
    }

    .command-display {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      resize: vertical;
      background-color: #f8f9fa;
      color: #333;
    }

    .command-display:focus {
      outline: none;
      border-color: #4facfe;
      background-color: white;
    }

    .status-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
      background: #28a745;
    }

    .nav-links {
      text-align: center;
      margin-bottom: 20px;
    }

    .nav-links a {
      display: inline-block;
      padding: 10px 20px;
      margin: 0 10px;
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: white;
      text-decoration: none;
      border-radius: 25px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .nav-links a:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
    }

    /* 漏液検出アラート */
    .leak-alert {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 2.5em;
      font-weight: bold;
      z-index: 9999;
      box-shadow: 0 4px 20px rgba(255, 65, 108, 0.5);
      animation: leakAlertPulse 1s infinite alternate;
      display: none;
    }

    .leak-alert.show {
      display: block;
    }

    @keyframes leakAlertPulse {
      0% {
        transform: scale(1);
        box-shadow: 0 4px 20px rgba(255, 65, 108, 0.5);
      }
      100% {
        transform: scale(1.02);
        box-shadow: 0 6px 30px rgba(255, 65, 108, 0.8);
      }
    }

    .leak-reset-btn {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid white;
      color: white;
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 0.6em;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .leak-reset-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-50%) scale(1.05);
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 2em;
      }
      
      .pump-grid {
        grid-template-columns: 1fr;
      }
      
      .btn-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <!-- 漏液検出アラート -->
  <div class="leak-alert" id="leakAlert">
    🚨 漏液発生！ 🚨
    <button class="leak-reset-btn" onclick="resetLeakAlert()">リセット</button>
  </div>
  
  <!-- 自動送信状態表示 -->
  <div style="position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.8); color: white; padding: 10px; border-radius: 5px; font-size: 14px; z-index: 1000;">
    自動送信状態: <span id="autoSendingStatus">待機中</span>
    <button onclick="resetAutoSendingStatus()" style="margin-left: 10px; padding: 2px 6px; font-size: 12px;">リセット</button>
  </div>

  <div class="container">
    <div class="header">
      <h1>ハイセラポンプ制御</h1>
    </div>

    <div class="content">
      <div class="nav-links">
        <a href="/">カメラストリーミング</a>
        <a href="/pump_control">ハイセラポンプ制御</a>
        <a href="/syringe_pump">シリンジポンプ制御</a>
      </div>

      <div class="status">
        <h3>システム状態</h3>
        <p>
          <span class="status-indicator" id="serialStatus1"></span>
          <span id="statusText1">USB0（ポンプ1-3）: 確認中...</span>
        </p>
        <p>
          <span class="status-indicator" id="serialStatus2"></span>
          <span id="statusText2">USB1（ポンプ4-6）: 確認中...</span>
        </p>
      </div>

      <div class="pump-grid">
        {% for pump in range(1,7) %}
        <div class="pump-box">
          <h2>ハイセラポンプ {{ pump }}</h2>
          
          <div class="control-group">
            <label>正逆切替:</label>
            <div class="input-group">
              <label class="switch">
                <input type="checkbox" onchange="toggleDirection({{ pump }}, this.checked)">
                <span class="slider"></span>
              </label>
              <span class="direction-label" id="dirLabel{{ pump }}">正転</span>
            </div>
          </div>
          <div class="control-group">
            <label>台形加速:</label>
            <div class="input-group">
              <label class="switch">
                <input type="checkbox" onchange="toggleAccel({{ pump }}, this.checked)">
                <span class="slider"></span>
              </label>
              <span class="direction-label" id="accelLabel{{ pump }}">OFF</span>
            </div>
          </div>

          <!-- 新しい弁常時Openスイッチ -->
          <div class="control-group">
            <label>弁常時Open:</label>
            <div class="input-group">
              <label class="switch">
                <input type="checkbox" onchange="toggleValve({{ pump }}, this.checked)">
                <span class="slider"></span>
              </label>
              <span class="direction-label" id="valveLabel{{ pump }}">OFF</span>
            </div>
          </div>
          <!-- /新しい弁常時Openスイッチ -->

          <div class="control-group">
            <label>ステップ数:</label>
            <div class="input-group">
              <input type="number" id="steps{{ pump }}" value="000000" min="0" max="999999" placeholder="ステップ数を入力">
            </div>
          </div>

          <div class="control-group">
            <label>回転数:</label>
            <div class="input-group">
              <span id="rpmValue{{ pump }}" class="current-display">0 rpm</span>
              <button class="btn btn-info" onclick="getRPM({{ pump }})">取得</button>
            </div>
          </div>

          <div class="btn-group">
            <button class="btn btn-primary" onclick="sendSteps({{ pump }})">送信</button>
            <button class="btn btn-danger" onclick="sendStop({{ pump }})">停止</button>
          </div>

          <div class="control-group">
            <label for="commandDisplay{{ pump }}">送信コマンド</label>
            <textarea id="commandDisplay{{ pump }}" rows="3" class="command-display" readonly placeholder="コマンドが送信されるとここに表示されます"></textarea>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </div>

  <script>
    // コマンドバイトを16進数とASCII文字の混合形式でフォーマット
    function formatCommandBytes(bytes, pump) {
      // ポンプ番号に応じてポート名を決定
      let portName;
      if (1 <= pump && pump <= 3) {
        portName = 'USB0';
      } else if (4 <= pump && pump <= 6) {
        portName = 'USB1';
      } else {
        portName = 'UNKNOWN';
      }
      
      let result = [portName + '→'];
      for (let i = 0; i < bytes.length; i++) {
        if (i === 0) {
          // STX (0x02)
          result.push('STX');
        } else if (i === 10) {
          // ETX (0x03)
          result.push('ETX');
        } else if (i === 9) {
          // チェックサムは16進数で表示
          result.push('0x' + bytes[i].toString(16).padStart(2, '0').toUpperCase());
        } else {
          // その他はASCII文字で表示（シングルクォートなし）
          if (bytes[i] >= 32 && bytes[i] <= 126) {
            result.push(String.fromCharCode(bytes[i]));
          } else {
            result.push('0x' + bytes[i].toString(16).padStart(2, '0').toUpperCase());
          }
        }
      }
      return result.join(' ');
    }

    // スイッチの状態をローカルストレージに保存
    function saveSwitchState(pump, switchType, state) {
      const key = `pump_${pump}_${switchType}`;
      localStorage.setItem(key, state.toString());
      console.log(`スイッチ状態を保存: ${key} = ${state}`);
    }

    // スイッチの状態をローカルストレージから取得
    function getSwitchState(pump, switchType, defaultValue = false) {
      const key = `pump_${pump}_${switchType}`;
      const saved = localStorage.getItem(key);
      const state = saved !== null ? saved === 'true' : defaultValue;
      console.log(`スイッチ状態を取得: ${key} = ${state}`);
      return state;
    }

    // 弁制御
    function toggleValve(pump, isOpen){
      const val = isOpen ? '1' : '0';
      document.getElementById('valveLabel' + pump).innerText = isOpen ? 'ON' : 'OFF';
      
      // 状態をローカルストレージに保存
      saveSwitchState(pump, 'valve', isOpen);
      
      sendPumpCommand(pump, 'B', val);
    }

    // 方向切替
    function toggleDirection(pump, isReverse){
      const dir = isReverse ? 'R' : 'F';
      document.getElementById('dirLabel' + pump).innerText = isReverse ? '逆転' : '正転';
      
      // 状態をローカルストレージに保存
      saveSwitchState(pump, 'direction', isReverse);
      
      sendPumpCommand(pump, dir);
    }

    // 台形加速切替
    function toggleAccel(pump, isOn){
      const val = isOn ? '1' : '0';
      document.getElementById('accelLabel' + pump).innerText = isOn ? 'ON' : 'OFF';
      
      // 状態をローカルストレージに保存
      saveSwitchState(pump, 'acceleration', isOn);
      
      sendPumpCommand(pump, 'A', val);
    }

    // ステップ送信
    function sendSteps(pump){
      const steps = document.getElementById('steps' + pump).value;
      sendPumpCommand(pump, 'M', steps);
    }

    // 停止
    function sendStop(pump){
      sendPumpCommand(pump, 'S');
    }

    // RPM取得
    async function getRPM(pump){
      console.log(`[DEBUG] getRPM呼び出し: ポンプ${pump}, isAutoSending=${isAutoSending}`);
      
      if (isAutoSending) {
        console.log('自動送信中のため、手動RPM取得をスキップします');
        alert('自動送信中です。しばらくお待ちください。');
        return;
      }
      
      try {
        console.log(`[DEBUG] getRPM呼び出し: ポンプ${pump}`);
        const response = await fetch(`/api/get_rpm?pump=${pump}`);
        const data = await response.json();
        
        console.log(`[DEBUG] getRPM レスポンス:`, data);
        
        const rpmDisplay = document.getElementById('rpmValue' + pump);
        console.log(`[DEBUG] getRPM 見つかった要素:`, rpmDisplay);
        
        // 送信コマンドの内容を表示
        if (data.command_bytes && data.command_bytes.length > 0) {
          const commandDisplay = document.getElementById('commandDisplay' + pump);
          if (commandDisplay) {
            const commandBytes = new Uint8Array(data.command_bytes);
            commandDisplay.value = formatCommandBytes(commandBytes, pump);
          }
        }
        
        if (data.success) {
          updateRpmDisplay(pump, data.rpm);
          console.log(data.message);
        } else {
          updateRpmDisplay(pump, 0);
          console.error('回転数取得失敗:', data.message);
        }
      } catch (error) {
        console.error('通信エラー:', error);
        updateRpmDisplay(pump, 0);
      }
    }

    // ポンプコマンド送信
    async function sendPumpCommand(pump, action, value = "000000", microstepState = "0") {
      console.log(`[DEBUG] sendPumpCommand呼び出し: ポンプ${pump}, アクション${action}, isAutoSending=${isAutoSending}`);
      
      if (isAutoSending) {
        console.log('自動送信中のため、ポンプコマンド送信をスキップします');
        alert('自動送信中です。しばらくお待ちください。');
        return;
      }
      
      try {
        const response = await fetch(`/api/pump_control?pump=${pump}&action=${action}&value=${value}&microstep=${microstepState}`);
        const data = await response.json();
        
        // 送信コマンドの内容を表示
        if (data.command_bytes && data.command_bytes.length > 0) {
          const commandDisplay = document.getElementById('commandDisplay' + pump);
          if (commandDisplay) {
            const commandBytes = new Uint8Array(data.command_bytes);
            commandDisplay.value = formatCommandBytes(commandBytes, pump);
          }
        }
        
        if (data.success) {
          console.log(data.message);
        } else {
          console.error('送信失敗:', data.message);
        }
      } catch (error) {
        console.error('通信エラー:', error);
      }
    }

    // システム状態確認
    async function checkStatus() {
      try {
        const response = await fetch('/api/status');
        const data = await response.json();
        
        const statusIndicator1 = document.getElementById('serialStatus1');
        const statusText1 = document.getElementById('statusText1');
        const statusIndicator2 = document.getElementById('serialStatus2');
        const statusText2 = document.getElementById('statusText2');
        
        // COM18（ポンプ1-3）の状態
        if (data.hysera_port1_status) {
          statusIndicator1.style.background = '#28a745';
          statusText1.textContent = 'USB0（ポンプ1-3）: オンライン';
        } else {
          statusIndicator1.style.background = '#dc3545';
          statusText1.textContent = 'USB0（ポンプ1-3）: オフライン';
        }
        
        // COM20（ポンプ4-6）の状態
        if (data.hysera_port2_status) {
          statusIndicator2.style.background = '#28a745';
          statusText2.textContent = 'USB1（ポンプ4-6）: オンライン';
        } else {
          statusIndicator2.style.background = '#dc3545';
          statusText2.textContent = 'USB1（ポンプ4-6）: オフライン';
        }
        
      } catch (error) {
        console.error('状態確認エラー:', error);
      }
    }

    // 漏液検出アラートの表示/非表示
    function updateLeakAlert() {
      const leakAlert = document.getElementById('leakAlert');
      if (leakAlert) {
        console.log('漏液アラート更新:', window.leakDetected);
        if (window.leakDetected) {
          leakAlert.classList.add('show');
          console.log('漏液アラートを表示しました');
        } else {
          leakAlert.classList.remove('show');
          console.log('漏液アラートを非表示にしました');
        }
      } else {
        console.error('漏液アラート要素が見つかりません');
      }
    }

    // リセット処理中フラグ
    let isResettingLeak = false;
    
    // 漏液検出状態をリセット
    async function resetLeakAlert() {
      try {
        console.log('漏液検出状態をリセット中...');
        
        // リセット処理中フラグを設定
        isResettingLeak = true;
        
        // まずフロントエンド側で即座にリセット
        window.leakDetected = false;
        updateLeakAlert();
        console.log('フロントエンド側で漏液アラートを非表示にしました');
        
        // サーバー側もリセット
        const response = await fetch('/api/reset_leak', {
          method: 'POST'
        });
        const data = await response.json();
        
        if (data.success) {
          console.log('サーバー側の漏液検出状態をリセットしました:', data.message);
          // サーバー側の状態を確認して同期
          window.leakDetected = data.leak_detected;
          updateLeakAlert();
          console.log('サーバー側の状態と同期しました:', data.leak_detected);
        } else {
          console.error('サーバー側のリセットに失敗:', data.message);
          // サーバー側のリセットに失敗した場合は、サーバー側の状態を再確認
          await checkLeakStatus();
        }
      } catch (error) {
        console.error('通信エラー:', error);
        // 通信エラーの場合も、サーバー側の状態を再確認
        await checkLeakStatus();
      } finally {
        // リセット処理完了後、少し待ってからフラグをリセット
        setTimeout(() => {
          isResettingLeak = false;
          console.log('リセット処理完了フラグをリセットしました');
        }, 3000); // 3秒後にフラグをリセット（少し長めに設定）
      }
    }

    // 漏液検出状態をチェック
    async function checkLeakStatus() {
      // リセット処理中は状態チェックをスキップ
      if (isResettingLeak) {
        console.log('リセット処理中のため、漏液状態チェックをスキップします');
        return;
      }
      
      try {
        const response = await fetch('/api/status');
        const data = await response.json();
        
        console.log('漏液検出状態確認:', data.leak_detected);
        
        if (data.leak_detected !== undefined) {
          const wasLeakDetected = window.leakDetected;
          window.leakDetected = data.leak_detected;
          
          if (window.leakDetected !== wasLeakDetected) {
            console.log('漏液検出状態が変更されました:', wasLeakDetected, '->', window.leakDetected);
            updateLeakAlert();
          } else {
            // 状態が変わらない場合も、表示を同期させる
            updateLeakAlert();
          }
        }
      } catch (error) {
        console.error('漏液検出状態確認エラー:', error);
      }
    }

    // 自動送信状態を管理するフラグ
    let isAutoSending = false;
    let autoSendingTimeout = null;
    
    // 自動送信状態の表示を更新
    function updateAutoSendingStatus() {
      const statusElement = document.getElementById('autoSendingStatus');
      if (statusElement) {
        if (isAutoSending) {
          statusElement.textContent = '自動送信中...';
          statusElement.style.color = 'orange';
        } else {
          statusElement.textContent = '待機中';
          statusElement.style.color = 'green';
        }
      }
    }
    
    // 自動送信状態を手動でリセット（デバッグ用）
    function resetAutoSendingStatus() {
      console.log('[DEBUG] 自動送信状態を手動でリセットします');
      isAutoSending = false;
      if (autoSendingTimeout) {
        clearTimeout(autoSendingTimeout);
        autoSendingTimeout = null;
      }
      updateAutoSendingStatus();
      console.log('[DEBUG] 自動送信状態をリセットしました');
    }
    
    // 回転数取得を自動実行（漏液検出のため）
    async function autoGetRpm() {
      if (isAutoSending) {
        console.log('自動送信中のため、スキップします');
        return;
      }
      
      try {
        isAutoSending = true;
        updateAutoSendingStatus();
        
        // タイムアウト設定（10秒で強制リセット）
        if (autoSendingTimeout) {
          clearTimeout(autoSendingTimeout);
        }
        autoSendingTimeout = setTimeout(() => {
          console.warn('[WARNING] 自動送信がタイムアウトしました。強制リセットします。');
          isAutoSending = false;
          updateAutoSendingStatus();
        }, 10000);
        
        console.log('自動回転数取得を実行中...', new Date().toLocaleTimeString());
        
        // ポンプ1の回転数を取得（漏液検出のため）
        const response = await fetch('/api/get_rpm?pump=1');
        
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const data = await response.json();
        
        if (data.success) {
          console.log('自動回転数取得成功:', data.rpm, 'rpm');
          
          // 画面のRPM表示を更新
          updateRpmDisplay(1, data.rpm);
        } else {
          console.log('自動回転数取得結果:', data.message);
        }
      } catch (error) {
        console.error('自動回転数取得エラー:', error);
      } finally {
        isAutoSending = false;
        if (autoSendingTimeout) {
          clearTimeout(autoSendingTimeout);
          autoSendingTimeout = null;
        }
        updateAutoSendingStatus();
      }
    }

    // RPM表示を更新する関数
    function updateRpmDisplay(pumpNumber, rpm) {
      console.log(`[DEBUG] updateRpmDisplay呼び出し: ポンプ${pumpNumber}, RPM=${rpm}`);
      
      const elementId = `rpmValue${pumpNumber}`;
      console.log(`[DEBUG] 検索する要素ID: ${elementId}`);
      
      const rpmElement = document.getElementById(elementId);
      console.log(`[DEBUG] 見つかった要素:`, rpmElement);
      
      if (rpmElement) {
        const oldText = rpmElement.textContent;
        rpmElement.textContent = rpm + ' rpm';
        console.log(`[DEBUG] ポンプ${pumpNumber}のRPM表示を更新: "${oldText}" -> "${rpm} rpm"`);
        console.log(`[DEBUG] 更新後の要素内容:`, rpmElement.textContent);
      } else {
        console.warn(`[ERROR] ポンプ${pumpNumber}のRPM表示要素が見つかりません (ID: ${elementId})`);
        console.log(`[DEBUG] 利用可能な要素を検索中...`);
        
        // 利用可能な要素を検索
        const allElements = document.querySelectorAll('[id*="rpm"]');
        console.log(`[DEBUG] RPM関連の要素:`, allElements);
        
        const allElementsWithValue = document.querySelectorAll('[id*="Value"]');
        console.log(`[DEBUG] Value関連の要素:`, allElementsWithValue);
      }
    }

    // スイッチの状態を復元する関数
    function restoreSwitchStates() {
      console.log('スイッチの状態を復元中...');
      
      // 各ポンプのスイッチ状態を復元
      for (let pump = 1; pump <= 6; pump++) {
        // 方向切替スイッチの復元
        const directionState = getSwitchState(pump, 'direction', false);
        const directionSwitch = document.querySelector(`input[type="checkbox"][onchange*="toggleDirection(${pump}"]`);
        if (directionSwitch) {
          directionSwitch.checked = directionState;
          document.getElementById('dirLabel' + pump).innerText = directionState ? '逆転' : '正転';
          console.log(`ポンプ${pump}の方向切替を復元: ${directionState ? '逆転' : '正転'}`);
        }
        
        // 台形加速スイッチの復元
        const accelerationState = getSwitchState(pump, 'acceleration', false);
        const accelerationSwitch = document.querySelector(`input[type="checkbox"][onchange*="toggleAccel(${pump}"]`);
        if (accelerationSwitch) {
          accelerationSwitch.checked = accelerationState;
          document.getElementById('accelLabel' + pump).innerText = accelerationState ? 'ON' : 'OFF';
          console.log(`ポンプ${pump}の台形加速を復元: ${accelerationState ? 'ON' : 'OFF'}`);
        }
        
        // 弁常時Openスイッチの復元
        const valveState = getSwitchState(pump, 'valve', false);
        const valveSwitch = document.querySelector(`input[type="checkbox"][onchange*="toggleValve(${pump}"]`);
        if (valveSwitch) {
          valveSwitch.checked = valveState;
          document.getElementById('valveLabel' + pump).innerText = valveState ? 'ON' : 'OFF';
          console.log(`ポンプ${pump}の弁常時Openを復元: ${valveState ? 'ON' : 'OFF'}`);
        }
      }
      
      console.log('スイッチの状態復元完了');
    }

    // ページ読み込み時に状態確認
    document.addEventListener('DOMContentLoaded', function() {
      console.log('ページ読み込み完了 - 漏液検出監視を開始します');
      
      // デバッグ: 利用可能な要素を確認
      console.log('[DEBUG] ページ読み込み時の要素確認');
      const allRpmElements = document.querySelectorAll('[id*="rpm"]');
      console.log('[DEBUG] RPM関連の要素:', allRpmElements);
      
      for (let i = 0; i < allRpmElements.length; i++) {
        console.log(`[DEBUG] 要素${i}: id="${allRpmElements[i].id}", text="${allRpmElements[i].textContent}"`);
      }
      
      // スイッチの状態を復元
      restoreSwitchStates();
      
      // 漏液検出状態を初期化
      window.leakDetected = false;
      
      // 自動送信状態を初期化
      isAutoSending = false;
      updateAutoSendingStatus();
      
      checkStatus();
      checkLeakStatus();
      
      // 30秒ごとに状態確認
      setInterval(checkStatus, 30000);
      
      // 1秒ごとに漏液検出状態を確認
      setInterval(checkLeakStatus, 1000);
      
      // 5秒ごとに自動回転数取得（漏液検出のため）
      const autoRpmInterval = setInterval(autoGetRpm, 5000);
      
      console.log('漏液検出監視が開始されました');
      console.log('自動回転数取得（5秒間隔）が開始されました');
      console.log('setInterval ID:', autoRpmInterval);
      
      // 初回実行（即座に1回実行）
      setTimeout(autoGetRpm, 1000);
    });
  </script>
</body>
