<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハイセラポンプ制御</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pump_control.css') }}">
</head>
<body>
  <!-- 漏液検出アラート -->
  <div class="leak-alert" id="leakAlert">
    🚨 漏液発生！ 🚨
    <button class="leak-reset-btn" onclick="resetLeakAlert()">リセット</button>
  </div>
  
  <!-- カメラストリーミング -->
  <div class="streaming-overlay" id="streamingOverlay">
    <div class="streaming-header">
      <span>📹 カメラ</span>
      <button class="streaming-minimize" onclick="event.stopPropagation(); toggleStreaming();">−</button>
    </div>
    <img src="{{ url_for('video_feed') }}" alt="カメラストリーム" class="streaming-video" id="streamingVideo" onerror="handleStreamingError()">
    <div class="streaming-controls">
      <button class="streaming-btn" onclick="event.stopPropagation(); refreshStream();">更新</button>
      <button class="streaming-btn" onclick="event.stopPropagation(); openFullStream();">拡大</button>
    </div>
  </div>
  
  <!-- 自動送信状態表示 -->
  <div style="position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.8); color: white; padding: 10px; border-radius: 5px; font-size: 14px; z-index: 1000;">
    自動送信状態: <span id="autoSendingStatus">待機中</span>
    <button onclick="resetAutoSendingStatus()" style="margin-left: 10px; padding: 2px 6px; font-size: 12px;">リセット</button>
  </div>

  <div class="container">
    <div class="header">
      <h1>ハイセラポンプ制御</h1>
    </div>

    <div class="content">
      <div class="nav-links">
        <a href="/">カメラストリーミング</a>
        <a href="/pump_control">ハイセラポンプ制御</a>
        <a href="/syringe_pump">シリンジポンプ制御</a>
      </div>

      <div class="status">
        <h3>システム状態</h3>
        <p>
          <span class="status-indicator" id="serialStatus1"></span>
          <span id="statusText1">USB0（ポンプ1-3）: 確認中...</span>
        </p>
        <p>
          <span class="status-indicator" id="serialStatus2"></span>
          <span id="statusText2">USB1（ポンプ4-6）: 確認中...</span>
        </p>
        <div class="control-group" style="margin-top: 15px;">
          <label>漏液チェック（回転数取得）:</label>
          <div class="input-group">
            <label class="switch">
              <input type="checkbox" id="leakCheckSwitch" onchange="toggleLeakCheck(this.checked)">
              <span class="slider"></span>
            </label>
            <span class="direction-label" id="leakCheckLabel">OFF</span>
          </div>
        </div>
      </div>

      <div class="pump-grid">
        {% for pump in range(1,7) %}
        <div class="pump-box">
          <h2>ハイセラポンプ {{ pump }}</h2>
          
          <!-- 正逆切替と台形加速を横並び -->
          <div class="control-row">
            <div class="control-group">
              <label>正逆切替:</label>
              <div class="input-group">
                <label class="switch">
                  <input type="checkbox" onchange="toggleDirection({{ pump }}, this.checked)">
                  <span class="slider"></span>
                </label>
                <span class="direction-label" id="dirLabel{{ pump }}">正転</span>
              </div>
            </div>
            <div class="control-group">
              <label>台形加速:</label>
              <div class="input-group">
                <label class="switch">
                  <input type="checkbox" onchange="toggleAccel({{ pump }}, this.checked)">
                  <span class="slider"></span>
                </label>
                <span class="direction-label" id="accelLabel{{ pump }}">OFF</span>
              </div>
            </div>
          </div>

          <!-- 弁常時OPENと励磁常時ONを横並び -->
          <div class="control-row">
            <div class="control-group">
              <label>弁常時Open:</label>
              <div class="input-group">
                <label class="switch">
                  <input type="checkbox" onchange="toggleValve({{ pump }}, this.checked)">
                  <span class="slider"></span>
                </label>
                <span class="direction-label" id="valveLabel{{ pump }}">OFF</span>
              </div>
            </div>
            <div class="control-group">
              <label>励磁常時ON:</label>
              <div class="input-group">
                <label class="switch">
                  <input type="checkbox" onchange="toggleExcitation({{ pump }}, this.checked)">
                  <span class="slider"></span>
                </label>
                <span class="direction-label" id="excitationLabel{{ pump }}">OFF</span>
              </div>
            </div>
          </div>

          <!-- ステップ数と速度設定を横並びにするラッパー -->
          <div class="control-row">
            <div class="control-group">
              <label>ステップ数:</label>
              <div class="input-group">
                <select id="steps{{ pump }}" class="steps-select" data-placeholder="ステップ数を選択または入力">
                  <option value="0">0</option>
                  <option value="200">1rot</option>
                  <option value="400">2rot</option>
                  <option value="600">3rot</option>
                  <option value="800">4rot</option>
                  <option value="1000">5rot</option>
                  <option value="2000">10rot</option>
                  <option value="3000">15rot</option>
                  <option value="4000">20rot</option>
                  <option value="5000">25rot</option>
                  <option value="6000">30rot</option>
                  <option value="8000">40rot</option>
                  <option value="10000">50rot</option>
                  <option value="12000">60rot</option>
                  <option value="14000">70rot</option>
                  <option value="16000">80rot</option>
                  <option value="18000">90rot</option>
                  <option value="20000">100rot</option>
                  <option value="30000">150rot</option>
                  <option value="40000">200rot</option>
                  <option value="50000">250rot</option>
                  <option value="60000">300rot</option>
                  <option value="80000">400rot</option>
                  <option value="100000">500rot</option>
                  <option value="200000">1000rot</option>
                  <option value="400000">2000rot</option>
                  <option value="800000">4000rot</option>
                </select>
              </div>
            </div>

            <div class="control-group">
              <label>速度設定:</label>
              <div class="input-group">
                <select id="rpmSetting{{ pump }}" class="steps-select" data-placeholder="RPMを選択" onmousedown="startRpmSetting()" onchange="setGlobalRPM({{ pump }})">
                  <option value="50">50 rpm</option>
                  <option value="60">60 rpm</option>
                  <option value="70">70 rpm</option>
                  <option value="80">80 rpm</option>
                  <option value="90">90 rpm</option>
                  <option value="100">100 rpm</option>
                  <option value="110">110 rpm</option>
                  <option value="120">120 rpm</option>
                  <option value="130">130 rpm</option>
                  <option value="140">140 rpm</option>
                  <option value="150">150 rpm</option>
                  <option value="160">160 rpm</option>
                  <option value="170">170 rpm</option>
                  <option value="180">180 rpm</option>
                  <option value="190">190 rpm</option>
                  <option value="200" selected>200 rpm</option>
                  <option value="210">210 rpm</option>
                  <option value="220">220 rpm</option>
                  <option value="230">230 rpm</option>
                  <option value="240">240 rpm</option>
                  <option value="250">250 rpm</option>
                  <option value="260">260 rpm</option>
                  <option value="270">270 rpm</option>
                  <option value="280">280 rpm</option>
                  <option value="290">290 rpm</option>
                  <option value="300">300 rpm</option>
                </select>
              </div>
            </div>
          </div>

          <div class="control-group">
            <label>回転速度:</label>
            <div class="input-group">
              <span id="rpmValue{{ pump }}" class="current-display">0 rpm</span>
              <button class="btn btn-info" onclick="getRPM({{ pump }})">取得</button>
            </div>
          </div>

          <div class="control-group">
            <label>トータル回転数:</label>
            <div class="input-group">
              <span id="totalRevolutions{{ pump }}" class="current-display">0 回転</span>
              <button class="btn btn-info" onclick="getTotalRevolutions({{ pump }})">取得</button>
            </div>
          </div>

          <div class="btn-group">
            <button class="btn btn-primary" onclick="sendSteps({{ pump }})">運転</button>
            <button class="btn btn-danger" onclick="sendStop({{ pump }})">停止</button>
          </div>

          <div class="control-group">
            <label for="commandDisplay{{ pump }}">送信コマンド</label>
            <textarea id="commandDisplay{{ pump }}" rows="3" class="command-display" readonly placeholder="コマンドが送信されるとここに表示されます"></textarea>
          </div>
          <!-- トータル回転数リセット（見た目のみ、実装は後で） -->
          <div class="control-group">
            <button id="resetTotalBtn{{ pump }}" class="btn btn-info" onclick="onResetTotalClicked({{ pump }})">トータル回転数リセット</button>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
  <script src="{{ url_for('static', filename='js/pump_control.js') }}"></script>
</body>
</html>
